spring:
  mongodb:
    uri: mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@localhost:27017/${MONGODB_DATABASE}?authSource=${MONGODB_AUTH_DB:admin}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/otragh_local_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver


logging:
  level:
    org.springframework.kafka: ERROR
    org.apache.kafka.clients.consumer: ERROR